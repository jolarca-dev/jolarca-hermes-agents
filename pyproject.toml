[project]
name = "jolarca-hermes-agents"
version = "0.1.0"
description = "Hermes AI agent implementations for the jolarca-dev marketplace fleet. Authoritative source for agent policies, prompts, and compliance controls."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "jolarca-dev" }]
keywords = ["ai-agents", "hermes", "compliance", "soc2", "iso27001", "gdpr", "marketplace"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "agents"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
