name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. Without this block GITHUB_TOKEN inherits the organisation
# default instead of a declared scope; every job here only reads repository
# contents, so contents: read is the correct ceiling.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff pyyaml
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        # Enforced here as well as in `make lint`, because this job calls the tools
        # directly instead of invoking make. Formatting drift is a control like any
        # other: declaring it in a comment that no runner executes is folklore.
        run: ruff format --check .
      - name: Validate agents
        run: python scripts/validate_agents.py
      - name: Check deny patterns
        run: python scripts/check_deny_patterns.py

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pytest pyyaml jsonschema
      - name: Run tests
        run: pytest tests/ agents/ -v

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Bandit security scan
        run: bandit -r . -x .venv/ -ll

  # --- Control-matrix CI jobs (supplementary, not required for merge) ---
  # These map to controls in docs/control-matrix.md.

  agent-policy-guard:
    name: agent-policy-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate agent policies
        run: python scripts/validate_agents.py
      - name: C1 approved-source retrieval only
        run: python scripts/check_approved_sources.py
      - name: C2 tenant and locale isolation
        run: python scripts/check_tenant_isolation.py
      - name: C5 translation review for sensitive content
        run: python scripts/check_translation_review.py
      - name: C7 no autonomous doctrinal decisions
        run: python scripts/check_doctrine_escalation.py
      - name: C12 prompt-injection defence
        run: python scripts/check_injection_defence.py

  deny-pattern-scan:
    name: deny-pattern-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Scan for forbidden mission-platform references
        run: python scripts/check_deny_patterns.py

  pii-scan:
    name: pii-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify consent agent PII policy
        run: python scripts/check_pii_redaction.py

  retention-check:
    name: retention-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify retention policies
        run: python scripts/check_retention.py

  budget-check:
    name: budget-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify orchestrator budget caps
        run: python scripts/check_budget.py

  kill-switch-test:
    name: kill-switch-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify kill-switch tool grant
        run: python scripts/check_kill_switch.py

  audit-check:
    name: audit-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify audit agent immutability guards
        run: python scripts/check_override_audit.py

  accessibility-gate:
    name: accessibility-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify accessibility agent gate config
        run: python scripts/check_accessibility.py

  adversarial-evals:
    name: adversarial-evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate evaluation suite grounding and coverage
        run: python scripts/check_eval_coverage.py

  provenance-check:
    name: provenance-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: C3 editorial approval before publication
        run: python scripts/check_editorial_approval.py
      - name: C4 source provenance for every generated claim
        run: python scripts/check_provenance.py

  vendor-risk-check:
    name: vendor-risk-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: C13 model vendor risk and null-provider invariant
        run: python scripts/check_vendor_risk.py

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 so the scan sees the whole history: a secret committed and
      # later amended away is still reachable in history and must not hide.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install checksum-verified gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of the published linux_x64 release asset, verified before the
          # binary is used so a substituted asset fails the job instead of
          # quietly scanning with the wrong tool. Version matches the pin already
          # declared in .pre-commit-config.yaml, whose hooks are NOT installed.
          # Provenance caveat: this digest is inherited from jolarca-security's
          # gitleaks workflow, which has not completed a successful run since
          # 2026-09-26, so this job is the first real execution of it. That is
          # why the job is supplementary rather than folded into the required
          # `security` context: a wrong digest surfaces here as one red job with
          # a one-line fix, not as a merge outage.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl -fsSL "$url" -o "/tmp/${asset}"
          printf '%s  /tmp/%s\n' "$GITLEAKS_SHA256" "$asset" | sha256sum -c -
          tar -xzf "/tmp/${asset}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Gitleaks secret scan (full history)
        # --redact keeps any detected value out of CI logs. gitleaks-action is
        # deliberately not used: it needs a GITLEAKS_LICENSE secret for
        # organisation-owned repositories and fails on every run, which is
        # finding F-01 in jolarca-security.
        run: gitleaks git . --redact --exit-code 1 --log-opts="--all"

  # ------------------------------------------------------------------------
  # markdown-lint — `.markdownlint.json` existed for a long time while nothing
  # executed it, which is ADR-0004 R3's "a control without a failing CI job is
  # folklore". Bound as a SUPPLEMENTARY job, the same posture as secrets-scan:
  # it reports, and promotion to a required context is a control-plane decision.
  # It arrives at zero findings because the 87 that existed were cleared first
  # by formatting-only PRs instead of by relaxing the rules.
  #
  # Pinning: an exact version of markdownlint-cli2 alone does NOT pin its ~80
  # transitive dependencies, which float on semver ranges. The committed
  # package-lock.json is what pins them, and `npm ci` verifies every entry's
  # integrity hash. --ignore-scripts is deliberate: measured on this lockfile
  # zero packages declare install scripts, so nothing legitimate is skipped and
  # no dependency lifecycle code can execute in the runner.
  # ------------------------------------------------------------------------
  markdown-lint:
    name: markdown-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Major pin. The residual float inside Node 20.x is accepted
          # deliberately: the artefact that decides the verdict is
          # markdownlint-cli2, which is integrity-pinned by the lockfile and
          # then asserted by exact string below.
          node-version: "20"

      - name: Install integrity-pinned markdownlint-cli2
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Assert the resolved tool version
        env:
          PINNED_CLI: "0.17.2"
          PINNED_MARKDOWNLINT: "0.37.4"
        run: |
          set -euo pipefail
          # Three traps, all hit on the first runner attempt:
          #   * markdownlint-cli2 prints its version for -v and then treats "-v" as a file
          #     pattern, so it exits non-zero. `|| true` is required -- the exact-string
          #     comparison below is the gate, not the exit code, so a crash still fails.
          #   * `set -o pipefail` makes `| head -1` abort the step: head exits early and the
          #     writer dies of SIGPIPE.
          #   * under `set -e` the substitution aborts before anything is printed, so the log
          #     shows no diagnosis at all.
          out="$(./node_modules/.bin/markdownlint-cli2 -v 2>&1 || true)"
          out="${out%%$'\n'*}"
          echo "resolved: $out"
          if [[ "$out" != "markdownlint-cli2 v${PINNED_CLI} (markdownlint v${PINNED_MARKDOWNLINT})" ]]; then
            echo "::error::tool version drifted from package-lock.json: $out"
            exit 1
          fi

      - name: Markdownlint tracked documents
        run: |
          set -euo pipefail
          # Tracked files only, so the verdict matches what a reviewer can see
          # in git and cannot be inflated or hidden by untracked scratch markdown.
          git ls-files -z '*.md' | xargs -0 --no-run-if-empty \
            ./node_modules/.bin/markdownlint-cli2 --config .markdownlint.json
