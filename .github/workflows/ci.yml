name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff pyyaml
      - name: Ruff lint
        run: ruff check .
      - name: Validate agents
        run: python scripts/validate_agents.py
      - name: Check deny patterns
        run: python scripts/check_deny_patterns.py

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pytest pyyaml
      - name: Run tests
        run: pytest tests/ agents/ -v

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Bandit security scan
        run: bandit -r . -x .venv/ -ll || true

  # --- Control-matrix CI jobs (supplementary, not required for merge) ---
  # These map to controls in docs/control-matrix.md.

  agent-policy-guard:
    name: agent-policy-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate agent policies
        run: python scripts/validate_agents.py

  deny-pattern-scan:
    name: deny-pattern-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for forbidden mission-platform references
        run: python scripts/check_deny_patterns.py

  pii-scan:
    name: pii-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify consent agent PII policy
        run: |
          python -c "
          import yaml
          with open('agents/consent/policy.yaml') as f:
              p = yaml.safe_load(f)
          assert 'store_pii_in_logs' in p['deny']['actions']
          assert 'cross_tenant_pii_access' in p['deny']['actions']
          print('pii-scan: PASSED')
          "

  retention-check:
    name: retention-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify retention policies
        run: |
          python -c "
          import yaml
          # Audit: 7-year retention
          with open('agents/audit/policy.yaml') as f:
              p = yaml.safe_load(f)
          assert p['retention']['max_days'] == 2555
          # Editorial: 7-year retention
          with open('agents/editorial/policy.yaml') as f:
              p = yaml.safe_load(f)
          assert p['retention']['max_days'] == 2555
          # Consent: 30-day retention (GDPR)
          with open('agents/consent/policy.yaml') as f:
              p = yaml.safe_load(f)
          assert p['retention']['max_days'] == 30
          print('retention-check: PASSED')
          "

  budget-check:
    name: budget-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify orchestrator budget caps
        run: |
          python -c "
          import yaml
          with open('agents/orchestrator/policy.yaml') as f:
              p = yaml.safe_load(f)
          assert 'budget' in p
          assert p['budget']['max_tokens_per_request'] > 0
          assert p['budget']['max_tokens_per_day'] > 0
          assert p['budget']['max_cost_per_day_usd'] > 0
          print('budget-check: PASSED')
          "

  kill-switch-test:
    name: kill-switch-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify kill-switch tool grant
        run: |
          python -c "
          import yaml
          with open('agents/orchestrator/agent.yaml') as f:
              a = yaml.safe_load(f)
          assert 'kill_switch' in a['tool_grants']
          print('kill-switch-test: PASSED')
          "

  audit-check:
    name: audit-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify audit agent immutability guards
        run: |
          python -c "
          import yaml
          with open('agents/audit/policy.yaml') as f:
              p = yaml.safe_load(f)
          assert 'modify_audit_log' in p['deny']['actions']
          assert 'delete_audit_log' in p['deny']['actions']
          print('audit-check: PASSED')
          "

  accessibility-gate:
    name: accessibility-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify accessibility agent gate config
        run: |
          python -c "
          import yaml
          with open('agents/accessibility/agent.yaml') as f:
              a = yaml.safe_load(f)
          assert a['human_gate'] == 'blocks_release'
          with open('agents/accessibility/policy.yaml') as f:
              p = yaml.safe_load(f)
          assert 'bypass_wcag_checks' in p['deny']['actions']
          print('accessibility-gate: PASSED')
          "
