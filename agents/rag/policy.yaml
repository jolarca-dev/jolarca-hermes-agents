allow:
  actions:
    - query_index
    - retrieve_documents
    - check_source_approval
    - log_retrieval

deny:
  actions:
    - generate_content
    - modify_index
    - cross_tenant_index_access
    - unapproved_source_retrieval
    - mission_platform_access
  resources:
    - "jol-*"
    - "journeyoflife-org/*"
    - "/opt/jol/*"

escalation:
  patterns:
    - "unapproved_source_requested"
    - "cross_tenant_access_attempt"
  action: block

retention:
  max_days: 90
  log_level: info
